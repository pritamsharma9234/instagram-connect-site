
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Connect</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f6fa;
      font-family: Arial, sans-serif;
      color: #202124;
    }
    .card {
      width: min(92%, 420px);
      padding: 32px 24px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { font-size: 27px; }
    p { line-height: 1.6; color: #5f6368; }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #635bdb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    small { display: block; margin-top: 18px; color: #777; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Instagram Connect</h1>
    <p>अपने Instagram अकाउंट को आधिकारिक अनुमति के माध्यम से सुरक्षित रूप से कनेक्ट करें।</p>
    <button id="connect">Connect Instagram</button>
    <small>यह स्वतंत्र प्रोजेक्ट है, Meta या Instagram की आधिकारिक वेबसाइट नहीं।</small>
  </main>
  <script>
    document.getElementById("connect").addEventListener("click", () => {
      alert("Instagram Connect अभी सेटअप हो रहा है। कृपया बाद में प्रयास करें।");
    });
  </script>
</body>
</html>
